<h2>Place an Order</h2>

<form (ngSubmit)="onSubmit()">
  <div class="panel">
    <h3>Order Lines</h3>
    <table class="data-table lines-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Product ID</th>
          <th>Quantity</th>
          <th>Unit Price (cents)</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (line of lines; track $index; let i = $index) {
          <tr>
            <td class="row-num">{{ i + 1 }}</td>
            <td>
              <input type="number" [name]="'productId' + i" [(ngModel)]="line.productId" min="1" required>
            </td>
            <td>
              <input type="number" [name]="'quantity' + i" [(ngModel)]="line.quantity" min="1" required>
            </td>
            <td>
              <input type="number" [name]="'unitPriceCents' + i" [(ngModel)]="line.unitPriceCents" min="0" required>
            </td>
            <td>
              <button type="button" (click)="removeLine(i)" [disabled]="lines.length === 1">Remove</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
    <button type="button" class="add-line-btn" (click)="addLine()">Add Line</button>
  </div>

  <div class="panel">
    <h3>Order Options</h3>
    <div class="form-row">
      <label for="promoCode">Promo Code</label>
      <input id="promoCode" type="text" name="promoCode" [(ngModel)]="promoCode" placeholder="(optional)">
    </div>
    <div class="form-row">
      <label for="region">Ship To Region</label>
      <select id="region" name="region" [(ngModel)]="region">
        <option value="US">US</option>
        <option value="EU">EU</option>
      </select>
    </div>
  </div>

  <div class="submit-row">
    <button type="submit" class="primary" [disabled]="submitting">Submit Order</button>
  </div>
</form>

@if (submitting) {
  <app-spinner></app-spinner>
}
@if (error) {
  <div class="error-box">{{ error }}</div>
}

@if (result; as r) {
  <app-order-summary [result]="r"></app-order-summary>
}
