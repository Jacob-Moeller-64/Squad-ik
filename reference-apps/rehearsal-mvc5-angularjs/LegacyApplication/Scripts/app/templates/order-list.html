<h2>Work Orders</h2>

<div class="panel stacked">
  <span class="panel-title">New work order</span>
  <label>Title <input type="text" ng-model="newOrder.Title"></label>
  <label>Priority
    <select ng-model="newOrder.Priority" ng-options="p as p for p in priorities"></select>
  </label>
  <label>Contract tier
    <select ng-model="newOrder.ContractTier" ng-options="t as t for t in tiers"></select>
  </label>
  <label><input type="checkbox" ng-model="newOrder.Weekend"> Weekend call-out</label>
  <button ng-click="create()">Create work order</button>
  <p ng-if="createError" class="state error">{{createError}}</p>
  <p ng-if="created" class="state ok">
    Created {{created.WorkOrderId}} &mdash; "{{created.Title}}" ({{created.Priority}}), due in {{created.DueInHours}}h.
  </p>
</div>

<div class="panel">
  <label>Filter by status:
    <select ng-model="statusFilter" ng-change="reload()">
      <option value="">(all)</option>
      <option ng-repeat="s in statuses" value="{{s}}">{{s}}</option>
    </select>
  </label>
</div>

<p ng-if="loading" class="state">Loading&hellip;</p>
<p ng-if="error" class="state error">{{error}}</p>
<p ng-if="!loading && !error && orders.length === 0" class="state">No work orders match.</p>
<div class="grid" ng-if="!loading && !error">
  <order-card ng-repeat="o in orders"
              order-id="{{o.Id}}" title="{{o.Title}}" status="{{o.Status}}"
              priority="{{o.Priority}}" site="{{o.Site}}"></order-card>
</div>
