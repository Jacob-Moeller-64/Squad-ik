<h2>Sign In</h2>
<div class="panel stacked">
  <span class="panel-title">FieldServe credentials required</span>
  <label>Username <input type="text" ng-model="username"></label>
  <label>Password <input type="password" ng-model="password"></label>
  <button ng-click="login()">Sign in</button>
  <p ng-if="error" class="state error">{{error}}</p>
</div>
<p class="state">Invoices are restricted. Contact IT ext. 4410 for an account.</p>
